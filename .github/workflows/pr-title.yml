name: PR Title

# PRs are squash-merged, so the title becomes the commit subject on main and is
# what release-please parses to decide the next version.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          types: |
            feat
            fix
            chore
            docs
            test
            refactor
            perf
            build
            ci
            style
            revert
